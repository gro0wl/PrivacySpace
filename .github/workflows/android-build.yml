name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 32 SDK
        run: |
          sdkmanager --install "platforms;android-32" "build-tools;32.0.0" "platform-tools"
          sdkmanager --licenses < /dev/null || true
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate CI keystore (for clean build without secrets)
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/ci.keystore \
            -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=RU"
          ls -lh /tmp/ci.keystore

      - name: Build Debug APK
        env:
          Space_storeFile: /tmp/ci.keystore
          Space_keyAlias: ci
          Space_keyPassword: android
          Space_storePassword: android
          Space_AppCenterSecret: ci-dummy-secret
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
