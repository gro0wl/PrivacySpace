name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for SDK packages
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 32 SDK (use preinstalled SDK on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools" || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-32" "build-tools;32.0.0" "platform-tools"

      - name: Set up JDK 11 for build (AGP 7.1 requires Java 11)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate CI keystore (for clean build without secrets)
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/ci.keystore \
            -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=RU"
          ls -lh /tmp/ci.keystore

      - name: Build Release APK
        env:
          Space_storeFile: /tmp/ci.keystore
          Space_keyAlias: ci
          Space_keyPassword: android
          Space_storePassword: android
          Space_AppCenterSecret: ci-dummy-secret
        run: ./gradlew assembleRelease --stacktrace

      - name: Get app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"
          ls -lh app/build/outputs/apk/release/

      - name: Rename APK (attach as .apk, not archive)
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PrivacySpace-v${{ steps.version.outputs.version }}.apk"
          ls -lh PrivacySpace-*.apk

      - name: Publish to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PrivacySpace v${{ steps.version.outputs.version }}
          files: PrivacySpace-v*.apk
          generate_release_notes: true
